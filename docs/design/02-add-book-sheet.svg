<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" width="390" height="780" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .scrim { fill: #080808; opacity: 0.5; }
      .ink { fill: #080808; }
      .body { fill: #363636; }
      .mute { fill: #898989; }
      .mute-soft { fill: #ababab; }
      .display-sm { font-size: 24px; font-weight: 500; }
      .eyebrow-sm { font-size: 12px; font-weight: 500; letter-spacing: 0.6px; text-transform: uppercase; }
      .body-md-strong { font-size: 16px; font-weight: 500; letter-spacing: -0.16px; }
      .body-md { font-size: 16px; font-weight: 400; letter-spacing: -0.16px; }
      .body-sm { font-size: 14px; font-weight: 400; }
      .caption { font-size: 12.8px; font-weight: 550; }
      .button-md { font-size: 16px; font-weight: 500; letter-spacing: -0.16px; }
      .cover-label { font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Faded library underneath -->
  <rect class="canvas" width="390" height="780"/>
  <rect class="scrim" width="390" height="780"/>

  <!-- Modal card: 8px radius, heavy multi-stop shadow -->
  <g transform="translate(20, 90)">
    <!-- shadow layers approximation -->
    <rect x="0" y="6" width="350" height="600" rx="8" fill="#080808" opacity="0.16"/>
    <rect x="0" y="2" width="350" height="600" rx="8" fill="#080808" opacity="0.08"/>
    <rect width="350" height="600" rx="8" fill="#ffffff"/>

    <!-- Eyebrow + Title -->
    <text x="32" y="56" class="mute eyebrow-sm">ADD TO YOUR SHELF</text>
    <text x="32" y="92" class="ink display-sm">책 추가</text>

    <!-- Text input (4px radius, 1px hairline border, 44px h) -->
    <g transform="translate(32, 120)">
      <rect width="286" height="44" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
      <!-- magnifier -->
      <circle cx="20" cy="22" r="6" fill="none" stroke="#898989" stroke-width="2"/>
      <line x1="25" y1="27" x2="30" y2="32" stroke="#898989" stroke-width="2" stroke-linecap="round"/>
      <text x="42" y="28" class="mute-soft body-md">ISBN 또는 제목으로 검색</text>
    </g>

    <!-- Results header -->
    <text x="32" y="200" class="mute eyebrow-sm">3 RESULTS</text>

    <!-- Result card 1 -->
    <g transform="translate(32, 216)">
      <rect width="286" height="120" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
      <!-- Cover -->
      <rect x="16" y="16" width="60" height="88" rx="4" fill="#7a3dff"/>
      <text x="22" y="92" fill="#ffffff" class="cover-label">이방인</text>
      <!-- Meta -->
      <text x="92" y="38" class="ink body-md-strong">이방인</text>
      <text x="92" y="58" class="body body-sm">알베르 카뮈</text>
      <text x="92" y="76" class="mute body-sm">민음사 · 2011</text>
      <!-- Primary button (black, 4px) -->
      <g>
        <rect x="92" y="84" width="100" height="32" rx="4" fill="#080808"/>
        <text x="142" y="105" fill="#ffffff" class="button-md" text-anchor="middle">서재에 담기</text>
      </g>
    </g>

    <!-- Result card 2 -->
    <g transform="translate(32, 352)">
      <rect width="286" height="120" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
      <rect x="16" y="16" width="60" height="88" rx="4" fill="#ed52cb"/>
      <text x="22" y="92" fill="#ffffff" class="cover-label">해설판</text>
      <text x="92" y="38" class="ink body-md-strong">이방인 (해설판)</text>
      <text x="92" y="58" class="body body-sm">알베르 카뮈</text>
      <text x="92" y="76" class="mute body-sm">문학동네 · 2019</text>
      <g>
        <rect x="92" y="84" width="100" height="32" rx="4" fill="#080808"/>
        <text x="142" y="105" fill="#ffffff" class="button-md" text-anchor="middle">서재에 담기</text>
      </g>
    </g>

    <!-- Result card 3 -->
    <g transform="translate(32, 488)">
      <rect width="286" height="100" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
      <rect x="16" y="16" width="60" height="68" rx="4" fill="#3b89ff"/>
      <text x="92" y="38" class="ink body-md-strong">이방인 (개정판)</text>
      <text x="92" y="58" class="body body-sm">알베르 카뮈 · 열린책들</text>
      <g>
        <rect x="92" y="68" width="100" height="28" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
        <text x="142" y="86" fill="#080808" font-size="14" font-weight="500" text-anchor="middle">서재에 담기</text>
      </g>
    </g>
  </g>
</svg>
