<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" width="390" height="780" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .surface-card { fill: #f6f6f3; }
      .secondary-bg { fill: #e5e5e0; }
      .scrim { fill: #000000; opacity: 0.5; }
      .ink { fill: #000000; }
      .ink-soft { fill: #211922; }
      .body { fill: #33332e; }
      .mute { fill: #62625b; }
      .ash { fill: #91918c; }
      .primary { fill: #e60023; }
      .on-primary { fill: #ffffff; }
      .heading-lg { font-size: 22px; font-weight: 600; }
      .body-strong { font-size: 16px; font-weight: 600; }
      .body-md { font-size: 16px; font-weight: 400; }
      .body-sm { font-size: 14px; font-weight: 400; }
      .body-sm-strong { font-size: 14px; font-weight: 700; }
      .button-md { font-size: 14px; font-weight: 700; }
      .link-md { font-size: 14px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background + scrim -->
  <rect class="canvas" width="390" height="780"/>
  <rect class="scrim" width="390" height="780"/>

  <!-- Modal card (rounded-lg 32, padding 32, shadow-modal hint) -->
  <g transform="translate(30, 140)">
    <!-- soft shadow approximation -->
    <rect x="0" y="8" width="330" height="500" rx="32" fill="#000000" opacity="0.16"/>
    <rect width="330" height="500" rx="32" fill="#ffffff"/>

    <!-- Title + subtitle -->
    <text x="32" y="72" class="ink heading-lg">환영합니다</text>
    <text x="32" y="96" class="mute body-md">내 서재로 다시 들어오세요.</text>

    <!-- Email label + input -->
    <text x="32" y="138" class="ink body-sm-strong">이메일</text>
    <g>
      <rect x="32" y="148" width="266" height="44" rx="16" fill="#ffffff" stroke="#91918c" stroke-width="1"/>
      <text x="46" y="176" class="ash body-md">you@example.com</text>
    </g>

    <!-- Password label + input -->
    <text x="32" y="220" class="ink body-sm-strong">비밀번호</text>
    <g>
      <rect x="32" y="230" width="266" height="44" rx="16" fill="#ffffff" stroke="#91918c" stroke-width="1"/>
      <text x="46" y="258" class="ash body-md">••••••••</text>
    </g>

    <!-- Primary login button -->
    <g transform="translate(32, 290)">
      <rect width="266" height="40" rx="16" fill="#e60023"/>
      <text x="133" y="26" class="on-primary button-md" text-anchor="middle">로그인</text>
    </g>

    <!-- Secondary: Google -->
    <g transform="translate(32, 342)">
      <rect width="266" height="40" rx="16" fill="#e5e5e0"/>
      <text x="133" y="26" class="ink button-md" text-anchor="middle">Google로 계속</text>
    </g>

    <!-- Toggle: signup link -->
    <text x="165" y="406" class="ink-soft link-md" text-anchor="middle" text-decoration="underline">처음이신가요? 계정 만들기</text>

    <!-- Guest link -->
    <text x="165" y="438" class="mute body-sm" text-anchor="middle">게스트로 둘러보기</text>
  </g>
</svg>
