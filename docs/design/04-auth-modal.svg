<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" width="390" height="780" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .scrim { fill: #080808; opacity: 0.5; }
      .ink { fill: #080808; }
      .body { fill: #363636; }
      .body-mid { fill: #5a5a5a; }
      .mute { fill: #898989; }
      .mute-soft { fill: #ababab; }
      .display-md { font-size: 32px; font-weight: 500; }
      .display-sm { font-size: 24px; font-weight: 500; }
      .body-md { font-size: 16px; font-weight: 400; letter-spacing: -0.16px; }
      .body-sm { font-size: 14px; font-weight: 400; }
      .body-sm-strong { font-size: 14px; font-weight: 500; }
      .eyebrow-sm { font-size: 12px; font-weight: 500; letter-spacing: 0.6px; text-transform: uppercase; }
      .button-md { font-size: 16px; font-weight: 500; letter-spacing: -0.16px; }
    </style>
  </defs>

  <!-- Background + scrim -->
  <rect class="canvas" width="390" height="780"/>
  <rect class="scrim" width="390" height="780"/>

  <!-- Modal card: 8px radius, heavy multi-stop shadow (level 4) -->
  <g transform="translate(30, 110)">
    <!-- shadow layers -->
    <rect x="0" y="8" width="330" height="540" rx="8" fill="#080808" opacity="0.26"/>
    <rect x="0" y="3" width="330" height="540" rx="8" fill="#080808" opacity="0.12"/>
    <rect width="330" height="540" rx="8" fill="#ffffff"/>

    <!-- Eyebrow -->
    <text x="32" y="64" class="mute eyebrow-sm">WELCOME BACK</text>

    <!-- Title -->
    <text x="32" y="100" class="ink display-md">로그인</text>
    <text x="32" y="128" class="body-mid body-md">서재로 돌아오세요.</text>

    <!-- Email label + input -->
    <text x="32" y="168" class="ink body-sm-strong">이메일</text>
    <g>
      <rect x="32" y="178" width="266" height="44" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
      <text x="46" y="206" class="mute-soft body-md">you@example.com</text>
    </g>

    <!-- Password label + input -->
    <text x="32" y="250" class="ink body-sm-strong">비밀번호</text>
    <g>
      <rect x="32" y="260" width="266" height="44" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
      <text x="46" y="288" class="mute-soft body-md">••••••••</text>
    </g>

    <!-- Primary login button (near-black, 4px) -->
    <g transform="translate(32, 322)">
      <rect width="266" height="44" rx="4" fill="#080808"/>
      <text x="133" y="29" fill="#ffffff" class="button-md" text-anchor="middle">로그인</text>
    </g>

    <!-- Secondary: Google (white + hairline) -->
    <g transform="translate(32, 376)">
      <rect width="266" height="44" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
      <text x="133" y="29" fill="#080808" class="button-md" text-anchor="middle">Google로 계속</text>
    </g>

    <!-- Divider eyebrow line -->
    <line stroke="#d8d8d8" stroke-width="1" x1="32" y1="446" x2="298" y2="446"/>

    <!-- Signup toggle (text-arrow style) -->
    <text x="165" y="478" class="ink body-sm-strong" text-anchor="middle" text-decoration="underline">처음이신가요? 계정 만들기 →</text>

    <!-- Guest link -->
    <text x="165" y="508" class="mute body-sm" text-anchor="middle">게스트로 둘러보기</text>
  </g>
</svg>
