<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" width="390" height="780" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .hairline { stroke: #d8d8d8; stroke-width: 1; }
      .ink { fill: #080808; }
      .body { fill: #363636; }
      .body-mid { fill: #5a5a5a; }
      .mute { fill: #898989; }
      .display-sm { font-size: 24px; font-weight: 500; }
      .eyebrow-sm { font-size: 12px; font-weight: 500; letter-spacing: 0.6px; text-transform: uppercase; }
      .body-sm-strong { font-size: 14px; font-weight: 500; }
      .body-sm { font-size: 14px; font-weight: 400; }
      .caption { font-size: 12.8px; font-weight: 550; }
      .button-md { font-size: 16px; font-weight: 500; letter-spacing: -0.16px; }
      .cover-label { font-size: 13px; font-weight: 600; letter-spacing: -0.2px; }
    </style>
  </defs>

  <rect class="canvas" width="390" height="780"/>

  <!-- Nav bar (height 64 with 1px hairline divider) -->
  <g>
    <line class="hairline" x1="0" y1="64" x2="390" y2="64"/>
    <!-- AddFab: 40 circle with hairline border (Webflow icon-circular) -->
    <circle cx="32" cy="32" r="20" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="22" y="31" width="20" height="2" class="ink"/>
    <rect x="31" y="22" width="2" height="20" class="ink"/>
    <!-- Title -->
    <text x="68" y="40" class="ink display-sm">내 서재</text>
    <!-- Sign in -->
    <text x="358" y="40" class="ink button-md" text-anchor="end">로그인</text>
  </g>

  <!-- Eyebrow + count -->
  <text x="16" y="100" class="mute eyebrow-sm">YOUR SHELF · 9 BOOKS</text>

  <!-- Grid: 3 rows × 3 columns, 16px padding-inline, 8px gap -->
  <g transform="translate(16, 118)">
    <!-- Row 1 -->
    <g>
      <!-- Card 1: purple -->
      <g>
        <rect width="110" height="160" rx="8" fill="#7a3dff"/>
        <text x="14" y="142" fill="#ffffff" class="cover-label">이방인</text>
        <text x="0" y="180" class="ink body-sm-strong">이방인</text>
        <text x="0" y="198" class="mute body-sm">알베르 카뮈</text>
      </g>
      <!-- Card 2: pink -->
      <g transform="translate(118, 0)">
        <rect width="110" height="160" rx="8" fill="#ed52cb"/>
        <text x="14" y="142" fill="#ffffff" class="cover-label">1984</text>
        <text x="0" y="180" class="ink body-sm-strong">1984</text>
        <text x="0" y="198" class="mute body-sm">조지 오웰</text>
      </g>
      <!-- Card 3: blue -->
      <g transform="translate(236, 0)">
        <rect width="110" height="160" rx="8" fill="#3b89ff"/>
        <text x="14" y="128" fill="#ffffff" class="cover-label">노르웨이의</text>
        <text x="14" y="146" fill="#ffffff" class="cover-label">숲</text>
        <text x="0" y="180" class="ink body-sm-strong">노르웨이의 숲</text>
        <text x="0" y="198" class="mute body-sm">무라카미 하루키</text>
      </g>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 220)">
      <g>
        <rect width="110" height="160" rx="8" fill="#ff6b00"/>
        <text x="14" y="142" fill="#ffffff" class="cover-label">데미안</text>
        <text x="0" y="180" class="ink body-sm-strong">데미안</text>
        <text x="0" y="198" class="mute body-sm">헤르만 헤세</text>
      </g>
      <g transform="translate(118, 0)">
        <rect width="110" height="160" rx="8" fill="#00d722"/>
        <text x="14" y="128" fill="#080808" class="cover-label">안나</text>
        <text x="14" y="146" fill="#080808" class="cover-label">카레니나</text>
        <text x="0" y="180" class="ink body-sm-strong">안나 카레니나</text>
        <text x="0" y="198" class="mute body-sm">톨스토이</text>
      </g>
      <g transform="translate(236, 0)">
        <rect width="110" height="160" rx="8" fill="#080808"/>
        <text x="14" y="142" fill="#ffffff" class="cover-label">무진기행</text>
        <text x="0" y="180" class="ink body-sm-strong">무진기행</text>
        <text x="0" y="198" class="mute body-sm">김승옥</text>
      </g>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 440)">
      <g>
        <rect width="110" height="160" rx="8" fill="#146ef5"/>
        <text x="14" y="128" fill="#ffffff" class="cover-label">죄와</text>
        <text x="14" y="146" fill="#ffffff" class="cover-label">벌</text>
        <text x="0" y="180" class="ink body-sm-strong">죄와 벌</text>
        <text x="0" y="198" class="mute body-sm">도스토옙스키</text>
      </g>
      <g transform="translate(118, 0)">
        <rect width="110" height="160" rx="8" fill="#ffae13"/>
        <text x="14" y="128" fill="#080808" class="cover-label">호밀밭의</text>
        <text x="14" y="146" fill="#080808" class="cover-label">파수꾼</text>
        <text x="0" y="180" class="ink body-sm-strong">호밀밭의 파수꾼</text>
        <text x="0" y="198" class="mute body-sm">샐린저</text>
      </g>
      <g transform="translate(236, 0)">
        <rect width="110" height="160" rx="8" fill="#ee1d36"/>
        <text x="14" y="128" fill="#ffffff" class="cover-label">어린</text>
        <text x="14" y="146" fill="#ffffff" class="cover-label">왕자</text>
        <text x="0" y="180" class="ink body-sm-strong">어린 왕자</text>
        <text x="0" y="198" class="mute body-sm">생텍쥐페리</text>
      </g>
    </g>
  </g>
</svg>
